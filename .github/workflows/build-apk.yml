name: Build APK

# Parte a ogni commit sul ramo principale (es. quando ricarichi lo zip),
# oppure a mano da Actions > Build APK > Run workflow.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # serve per pubblicare l'APK nella sezione Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Estrai lo zip del progetto
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          if [ -z "$ZIP" ]; then echo "Nessun file .zip nella radice del repository"; exit 1; fi
          echo "Estraggo $ZIP"
          rm -rf _src && mkdir _src && unzip -q "$ZIP" -d _src
          PKG=$(find _src -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PKG" ]; then echo "package.json non trovato nello zip"; exit 1; fi
          echo "PROJ=$(dirname "$PKG")" >> "$GITHUB_ENV"
          echo "Progetto in: $(dirname "$PKG")"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Dipendenze e build web
        working-directory: ${{ env.PROJ }}
        run: |
          npm ci
          npm run build

      - name: Progetto Android (Capacitor)
        working-directory: ${{ env.PROJ }}
        run: |
          npx cap add android
          bash scripts/customize-android.sh ${{ github.run_number }}
          npx cap sync android

      - name: Compila APK
        working-directory: ${{ env.PROJ }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Firma APK
        working-directory: ${{ env.PROJ }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Uso la chiave dai Secrets del repository"
            echo "$KEYSTORE_BASE64" | base64 -d > ks.jks
            KS=ks.jks; PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-bilancio}"
          else
            echo "Uso la chiave inclusa nello zip (keystore/bilancio.jks)"
            KS=keystore/bilancio.jks; PASS="8L78VgWPkzhAaAYivUBgcWVO"; ALIAS=bilancio
          fi
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="$GITHUB_WORKSPACE/Bilancio-1.0.${{ github.run_number }}.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          echo "APK=Bilancio-1.0.${{ github.run_number }}.apk" >> "$GITHUB_ENV"

      - name: Allega l'APK alla build
        uses: actions/upload-artifact@v4
        with:
          name: Bilancio-APK
          path: ${{ env.APK }}

      - name: Pubblica in Releases (scaricabile dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bilancio 1.0.${{ github.run_number }}
          files: ${{ env.APK }}
          make_latest: true
          body: |
            Apri questa pagina dal telefono, tocca il file .apk per scaricarlo e poi aprilo per installare.
            Se hai gia' l'app, si aggiorna mantenendo tutti i dati.
